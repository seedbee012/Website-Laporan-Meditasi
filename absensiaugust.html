<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Absensi Matriks Meditasi (Agustus)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #f8fafc; }

        /* Jika dari form bernilai "Yes" -> Kotak menjadi biru cerah */
        .select-yes {
            background-color: #06b6d4 !important;
            color: #ffffff !important;
            font-weight: bold;
            border-radius: 4px;
            padding: 4px 8px;
            display: inline-block;
        }
        
        /* Jika "No" atau kosong -> Tetap polos sewajarnya teks tabel biasa */
        .select-no {
            color: #94a3b8 !important;
        }
        
        .sticky-col {
            position: sticky;
            left: 0;
            background-color: #f8fafc !important;
            border-right: 2px solid #cbd5e1 !important;
            z-index: 10;
        }

        .custom-scrollbar::-webkit-scrollbar {
            height: 10px;
            width: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 6px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen py-6 px-4 sm:py-8">

    <div class="max-w-full mx-auto bg-white rounded-2xl shadow-md border border-slate-100 p-4 sm:p-6">
        
        <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
            <a href="index.html" class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors">
                ← Kembali ke Halaman Utama
            </a>
        </div>

        <div class="mb-6">
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">📋 Tabel Kontrol Absensi (1 Agustus - 31 Agustus)</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">Geser tabel ke kanan untuk melihat tanggal berikutnya.</p>
        </div>

        <div class="overflow-x-auto border border-slate-200 rounded-xl shadow-xs custom-scrollbar">
            <table class="w-full text-xs sm:text-sm text-left border-collapse">
                <thead class="bg-slate-50 text-slate-700 font-bold border-b border-slate-200 sticky top-0 z-20">
                    <tr id="table-headers"></tr>
                </thead>
                <tbody id="table-matrix-rows" class="divide-y divide-slate-200 bg-white"></tbody>
            </table>
        </div>
    </div>

<script type="module">
    import {
        db,
        collection,
        getDocs
    } from "./firebase.js";

    const masterMurid = [
        "Suk Wan", "Ahin", "Heri Sg", "Uyong", "Yuliana", "Leonardi", "Limey",
        "Muliani", "Heri Susanto", "Titin", "Harvey", "Meini", "Rini", "Johan",
        "Ani", "Santi", "Jessica", "Herliana", "Yu Ing", "Aji", "Nanda", "Henry",
        "Yanti", "Ria", "Enje", "Diana", "Herman S", "Suryani"
    ];

    // Generate list tanggal untuk bulan Juli 2026
    const tanggalList = [];
    for (let i = 1; i <= 31; i++) {
        let day = i < 10 ? '0' + i : i;
        tanggalList.push(`2026-08-${day}`);
    }
    
    function normalizeText(v) {
        return (v || '').toString().toLowerCase().trim();
    }

    function normalizeDate(v) {
        if (!v) return '';
        return v.toString().slice(0, 10);
    }
    
    function isYesStatus(value) {
        return value === "Yes" || value === "Ya";
    }

    // RENDER MATRIX (Murni membaca data dari form Firebase)
    async function renderMatrix() {
        let dataFirebase = [];
        try {
            const snapshot = await getDocs(collection(db, "laporanMeditasi"));
            snapshot.forEach((docSnap) => {
                dataFirebase.push({
                    firestoreId: docSnap.id,
                    ...docSnap.data()
                });
            });
        } catch (err) {
            console.error("Gagal memuat data Firebase:", err);
        }

        const headerRow = document.getElementById('table-headers');
        const tbody = document.getElementById('table-matrix-rows');

        // Render Headers Tanggal
        let headerHTML = `<th class="px-4 py-3.5 bg-slate-100 text-slate-900 font-bold border-b-2 border-slate-300 sticky-col min-w-[160px]">Nama</th>`;
        tanggalList.forEach(tgl => {
            const d = new Date(tgl);
            const displayDate = `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
            headerHTML += `<th class="px-3 py-3.5 text-center font-semibold border-r border-slate-200 min-w-[95px]">${displayDate}</th>`;
        });
        headerRow.innerHTML = headerHTML;

        // Render Baris Murid
        tbody.innerHTML = '';
        masterMurid.forEach(nama => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50/50 transition-colors";

            let rowHTML = `<td class="px-4 py-3 font-bold text-slate-900 sticky-col shadow-xs">${nama}</td>`;

            tanggalList.forEach(tgl => {
                const dataJurnal = dataFirebase.find(item =>
                    normalizeDate(item.tanggal) === tgl &&
                    normalizeText(item.nama) === normalizeText(nama)
                );

                let status = "No";
                if (dataJurnal) {
                    status = isYesStatus(dataJurnal.ikut_sesi) ? "Yes" : "No";
                }

                // Jika "Yes" maka dibungkus class style biru (.select-yes). 
                // Jika "No" atau kosong (belum isi form) maka tetap polos teks biasa (.select-no).
                rowHTML += `
                <td class="px-3 py-2 text-center border-r border-slate-100">
                    ${status === "Yes" 
                        ? `<span class="select-yes text-xs">Yes</span>`
                        : `<span class="select-no text-xs">No</span>`
                    }
                </td>`;
            });

            tr.innerHTML = rowHTML;
            tbody.appendChild(tr);
        });

        // TOTAL HADIR DI PALING BAWAH
        const totalRow = document.createElement("tr");
        totalRow.className = "bg-indigo-100 font-bold text-indigo-700";

        let totalHTML = `
        <td class="px-4 py-3 sticky-col text-slate-900 bg-indigo-100 font-bold">
            👥 Total Hadir
        </td>`;

        tanggalList.forEach(tgl => {
            let totalYes = 0;
            masterMurid.forEach(nama => {
                const dataJurnal = dataFirebase.find(item =>
                    normalizeDate(item.tanggal) === tgl &&
                    normalizeText(item.nama) === normalizeText(nama)
                );
                if (dataJurnal && isYesStatus(dataJurnal.ikut_sesi)) {
                    totalYes++;
                }
            });

            totalHTML += `
            <td class="text-center border-r border-slate-200 font-bold py-3">
                ${totalYes}
            </td>`;
        });

        totalRow.innerHTML = totalHTML;
        tbody.appendChild(totalRow);
    }

    renderMatrix();
</script>
</body>
</html>
