<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Meditasi Harian</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #f8fafc; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.6s ease-out forwards; }
        textarea { resize: none; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen py-6 px-4 sm:py-12 sm:px-6 lg:px-8">

    <!-- PANEL LOGIN ADMIN -->
    <div class="max-w-2xl mx-auto mb-6 bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
        <div id="login-form-block" class="flex flex-wrap gap-3 items-end justify-between">
            <div class="grow grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Email Resmi</label>
                    <input type="email" id="login-email" placeholder="contoh@meditasi.com" class="w-full rounded-lg border border-slate-200 px-3 py-1.5 text-sm outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" class="w-full rounded-lg border border-slate-200 px-3 py-1.5 text-sm outline-none focus:border-indigo-500">
                </div>
            </div>
            <!-- Nama fungsi diubah menjadi prosesLogin() agar sesuai dengan JavaScript -->
            <button onclick="prosesLogin()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-5 py-2 rounded-lg cursor-pointer transition-colors">
                Masuk
            </button>
        </div>

        <div id="login-status-block" class="hidden flex items-center justify-between text-sm">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-slate-600">Login sebagai: <strong id="user-display-name" class="text-slate-900"></strong></span>
            </div>
            <button onclick="prosesLogout()" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 font-semibold px-3 py-1.5 rounded-lg transition-colors cursor-pointer">
                Keluar
            </button>
        </div>
    </div>

    <!-- AREA FORM UTAMA -->
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-10 animate-fade-in">
        
        <div class="mb-6 flex flex-wrap gap-2 justify-between items-center">
            <a href="riwayat.html" class="inline-flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition-colors shadow-md cursor-pointer">
                🔍 Buka Lembar Riwayat Laporan →
            </a>
            
            <a href="absensi.html" class="inline-flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-sm font-semibold px-4 py-2.5 rounded-xl transition-colors border border-indigo-100 cursor-pointer">
                📊 Absensi →
            </a>
        </div>

        <div class="mb-8 text-center">
            <h1 id="form-title" class="text-2xl sm:text-3xl font-semibold text-slate-900 tracking-tight">Laporan Meditasi Harian</h1>
            <p id="role-indicator" class="mt-2 text-xs sm:text-sm text-emerald-600 font-medium">Mode: Pengguna Umum</p>
        </div>

        <!-- Submit form memanggil fungsi simpanJurnal -->
        <form id="meditationForm" onsubmit="simpanJurnal(event)" class="space-y-6">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="input-tanggal" class="block text-sm font-medium text-slate-700 mb-1.5">Tanggal</label>
                    <input type="date" id="input-tanggal" name="tanggal" required class="w-full rounded-lg border border-slate-200 px-3 py-2 text-slate-900 outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label for="input-nama" class="block text-sm font-medium text-slate-700 mb-1.5">Nama</label>
                    <input type="text" id="input-nama" name="nama" placeholder="Nama Anda" required class="w-full rounded-lg border border-slate-200 px-3 py-2 text-slate-900 outline-none focus:border-emerald-500">
                </div>
            </div>

            <hr class="border-slate-100">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Ikut sesi meditasi hari ini?</label>
                <div class="flex gap-6">
                    <!-- id diatur sebagai input-sesi untuk memudahkan penarikan nilai -->
                    <select id="input-sesi" name="ikut_sesi" required class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm outline-none focus:border-emerald-500">
                        <option value="Ya">Ya</option>
                        <option value="Tidak">Tidak</option>
                    </select>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="input-jalan" class="block text-sm font-medium text-slate-700 mb-1">Durasi Meditasi Jalan</label>
                    <textarea id="input-jalan" name="durasi_jalan" rows="3" placeholder="Contoh: 10 menit" class="w-full rounded-lg border border-slate-200 px-4 py-2 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="input-duduk" class="block text-sm font-medium text-slate-700 mb-1">Durasi Meditasi Duduk</label>
                    <textarea id="input-duduk" name="durasi_duduk" rows="3" placeholder="Contoh: 30 menit" class="w-full rounded-lg border border-slate-200 px-4 py-2 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="input-wandering" class="block text-sm font-medium text-slate-700 mb-1">Frekuensi Wandering Mind</label>
                    <textarea id="input-wandering" name="frekuensi_wandering" rows="3" placeholder="Contoh: 1-5 kali" class="w-full rounded-lg border border-slate-200 px-4 py-4 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="input-cepat" class="block text-sm font-medium text-slate-700 mb-1">Saat menyadari pikiran mengembara, apakah dapat kembali konsentrasi ke napas dengan cepat?</label>
                    <textarea id="input-cepat" name="kembali_cepat" rows="3" placeholder="Contoh: Ya, mudah/sulit" class="w-full rounded-lg border border-slate-200 px-4 py-4 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="input-hold" class="block text-sm font-medium text-slate-700 mb-1">Durasi bisa fokus pegang nafas tanpa gangguan(terlama dan terpendek)</label>
                    <textarea id="input-hold" name="durasi_hold" rows="3" placeholder="Contoh: Terlama: 20 menit, terpendek: 10 menit" class="w-full rounded-lg border border-slate-200 px-4 py-4 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="input-halus" class="block text-sm font-medium text-slate-700 mb-1">Apakah ada nafas halus</label>
                    <textarea id="input-halus" name="durasi_halus" rows="3" placeholder="Contoh: Ya, sekitar 10 menit/ tidak ada" class="w-full rounded-lg border border-slate-200 px-4 py-2 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="input-cahaya" class="block text-sm font-medium text-slate-700 mb-1">Muncul Cahaya</label>
                    <textarea id="input-cahaya" name="muncul_cahaya" rows="3" placeholder="Contoh: Tidak ada/Ya, sedikit" class="w-full rounded-lg border border-slate-200 px-4 py-4 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="input-pengalaman" class="block text-sm font-medium text-slate-700 mb-1">Pengalaman / Pengamatan Kondisi Batin</label>
                    <textarea id="input-pengalaman" name="pengalaman" rows="3" placeholder="Apa yang Anda rasakan selama meditasi?" class="w-full rounded-lg border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div class="bg-indigo-50/40 border border-indigo-100 rounded-xl p-4">
                    <label for="input-review" class="block text-sm font-medium text-indigo-900 mb-1">Review dari Ci Suk Wan saat Sesi Sharing</label>
                    <textarea id="input-review" name="review_sharing" rows="2" placeholder="Tuliskan review/arahan dari Ci Suk Wan yang diberikan saat sesi sharing..." class="w-full rounded-lg border border-indigo-200 bg-white px-4 py-2 text-sm outline-none focus:border-indigo-500"></textarea>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" id="btn-simpan" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm active:scale-[0.99] transition-all cursor-pointer">
                    Simpan Laporan Meditasi
                </button>
            </div>
        </form>

    </div>

    <script>
        // 1. Fungsi mengambil Role
        function getRole() {
            return localStorage.getItem('currentUserRole') || 'User';
        }

        // 2. Fungsi Login Admin Statis (Sudah disesuaikan ID elemennya)
        function prosesLogin() {
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            if (email === 'sukwan@meditasi.com' && password === 'sukwan123') {
                localStorage.setItem('currentUserRole', 'SukWan');
                alert("✅ Selamat datang Ci Suk Wan (Guru)!");
                window.location.reload(); 
            } else if (email === 'titin@meditasi.com' && password === 'titin123') {
                localStorage.setItem('currentUserRole', 'Titin');
                alert("✅ Selamat datang Ci Titin (Editor)!");
                window.location.reload(); 
            } else {
                alert("❌ Email atau Password Admin salah. Silakan coba lagi.");
            }
        }

        // 3. Fungsi Logout
        function prosesLogout() {
            localStorage.removeItem('currentUserRole');
            alert("Keluar berhasil. Mode berganti ke Pengguna Umum.");
            window.location.href = 'index.html';
        }

        // 4. Inisialisasi Tampilan & Cek Mode Edit Data
        window.addEventListener('DOMContentLoaded', () => {
            const role = getRole();
            const formTitle = document.getElementById('form-title');
            const btnSimpan = document.getElementById('btn-simpan');
            const roleIndicator = document.getElementById('role-indicator');
            const loginFormBlock = document.getElementById('login-form-block');
            const loginStatusBlock = document.getElementById('login-status-block');
            const userDisplayName = document.getElementById('user-display-name');

            // Atur visual panel atas berdasarkan status login
            if (role === 'SukWan' || role === 'Titin') {
                if (roleIndicator) roleIndicator.innerText = `Mode Admin: ${role === 'SukWan' ? 'Ci Suk Wan (Guru)' : 'Ci Titin (Editor)'}`;
                if (loginFormBlock) loginFormBlock.classList.add('hidden');
                if (loginStatusBlock) {
                    loginStatusBlock.classList.remove('hidden');
                    if (userDisplayName) userDisplayName.innerText = role === 'SukWan' ? 'Ci Suk Wan' : 'Ci Titin';
                }
            }

            // CEK PARAMETER URL UNTUK EDIT DATA
            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('editId');

            if (editId) {
                if (formTitle) formTitle.innerText = "Koreksi / Edit Jurnal Meditasi 📝";
                if (btnSimpan) btnSimpan.innerText = "Simpan Perubahan 💾";
                
                const db = JSON.parse(localStorage.getItem('meditasi_db')) || [];
                const dataLama = db.find(item => item.id == editId);

                if (dataLama) {
                    if(document.getElementById('input-nama')) document.getElementById('input-nama').value = dataLama.nama || '';
                    if(document.getElementById('input-tanggal')) document.getElementById('input-tanggal').value = dataLama.tanggal || '';
                    if(document.getElementById('input-sesi')) document.getElementById('input-sesi').value = dataLama.ikut_sesi || 'Ya';
                    if(document.getElementById('input-jalan')) document.getElementById('input-jalan').value = dataLama.durasi_jalan || '';
                    if(document.getElementById('input-duduk')) document.getElementById('input-duduk').value = dataLama.durasi_duduk || '';
                    if(document.getElementById('input-wandering')) document.getElementById('input-wandering').value = dataLama.frekuensi_wandering || '';
                    if(document.getElementById('input-cepat')) document.getElementById('input-cepat').value = dataLama.kembali_cepat || '';
                    if(document.getElementById('input-hold')) document.getElementById('input-hold').value = dataLama.durasi_hold || '';
                    if(document.getElementById('input-halus')) document.getElementById('input-halus').value = dataLama.durasi_halus || '';
                    if(document.getElementById('input-cahaya')) document.getElementById('input-cahaya').value = dataLama.muncul_cahaya || '';
                    if(document.getElementById('input-pengalaman')) document.getElementById('input-pengalaman').value = dataLama.pengalaman || '';
                    if(document.getElementById('input-review')) document.getElementById('input-review').value = dataLama.review_sharing || '';
                    
                    // Proteksi nama & tanggal untuk user biasa saat mengedit
                    if (role === 'User') {
                        if(document.getElementById('input-nama')) document.getElementById('input-nama').disabled = true;
                        if(document.getElementById('input-tanggal')) document.getElementById('input-tanggal').disabled = true;
                    }
                }
            } else {
                // Jika input baru, isi otomatis kolom tanggal dengan hari ini
                const hariIni = new Date().toISOString().split('T')[0];
                if(document.getElementById('input-tanggal')) document.getElementById('input-tanggal').value = hariIni;
            }
        });

        // 5. Submit atau Update Form Jurnal
        function simpanJurnal(event) {
            if(event) event.preventDefault();

            const nama = document.getElementById('input-nama').value.trim();
            const tanggal = document.getElementById('input-tanggal').value;

            if (!nama || !tanggal) {
                alert("Mohon isi Nama dan Tanggal terlebih dahulu!");
                return;
            }

            let db = JSON.parse(localStorage.getItem('meditasi_db')) || [];
            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('editId');

            if (editId) {
                // --- MODE PROSES UPDATE (EDIT) ---
                const idx = db.findIndex(item => item.id == editId);
                if (idx !== -1) {
                    db[idx].nama = nama;
                    db[idx].tanggal = tanggal;
                    db[idx].ikut_sesi = document.getElementById('input-sesi').value;
                    db[idx].durasi_jalan = document.getElementById('input-jalan').value;
                    db[idx].durasi_duduk = document.getElementById('input-duduk').value;
                    db[idx].frekuensi_wandering = document.getElementById('input-wandering').value;
                    db[idx].kembali_cepat = document.getElementById('input-cepat').value;
                    db[idx].durasi_hold = document.getElementById('input-hold').value;
                    db[idx].durasi_halus = document.getElementById('input-halus').value;
                    db[idx].muncul_cahaya = document.getElementById('input-cahaya').value;
                    db[idx].pengalaman = document.getElementById('input-pengalaman').value;
                    db[idx].review_sharing = document.getElementById('input-review').value;
                    
                    localStorage.setItem('meditasi_db', JSON.stringify(db));
                    alert("✅ Perubahan jurnal berhasil disimpan!");
                    window.location.href = 'riwayat.html'; 
                }
            } else {
                // --- MODE INPUT DATA BARU ---
                const targetDb = JSON.parse(localStorage.getItem('target_db')) || [];
                const matchTarget = targetDb.find(t => t.nama.toLowerCase() === nama.toLowerCase() && t.tanggal === tanggal);
                const prOtomatis = matchTarget ? matchTarget.pr_individu : "";

                const jurnalBaru = {
                    id: Date.now(), 
                    nama: nama,
                    tanggal: tanggal,
                    ikut_sesi: document.getElementById('input-sesi').value,
                    durasi_jalan: document.getElementById('input-jalan').value,
                    durasi_duduk: document.getElementById('input-duduk').value,
                    frekuensi_wandering: document.getElementById('input-wandering').value,
                    kembali_cepat: document.getElementById('input-cepat').value,
                    durasi_hold: document.getElementById('input-hold').value,
                    durasi_halus: document.getElementById('input-halus').value,
                    muncul_cahaya: document.getElementById('input-cahaya').value,
                    pengalaman: document.getElementById('input-pengalaman').value,
                    review_sharing: document.getElementById('input-review').value,
                    pr_individu: prOtomatis 
                };

                db.push(jurnalBaru);
                localStorage.setItem('meditasi_db', JSON.stringify(db));
                alert("✅ Jurnal Meditasi Anda berhasil dikirim!");
                
                // Bersihkan field agar bisa dipakai murid lain
                document.getElementById('input-nama').value = "";
                document.getElementById('input-jalan').value = "";
                document.getElementById('input-duduk').value = "";
                document.getElementById('input-wandering').value = "";
                document.getElementById('input-cepat').value = "";
                document.getElementById('input-hold').value = "";
                document.getElementById('input-halus').value = "";
                document.getElementById('input-cahaya').value = "";
                document.getElementById('input-pengalaman').value = "";
                document.getElementById('input-review').value = "";
            }
        }
    </script>
</body>
</html>
