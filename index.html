<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Meditasi Harian</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #f8fafc; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.6s ease-out forwards; }
        textarea { resize: none; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen py-6 px-4 sm:py-12 sm:px-6 lg:px-8">

    <div class="max-w-2xl mx-auto mb-6 bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
        <div id="login-form-block" class="flex flex-wrap gap-3 items-end justify-between">
            <div class="grow grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Email Resmi</label>
                    <input type="email" id="login-email" placeholder="contoh@meditasi.com" class="w-full rounded-lg border border-slate-200 px-3 py-1.5 text-sm outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" class="w-full rounded-lg border border-slate-200 px-3 py-1.5 text-sm outline-none focus:border-indigo-500">
                </div>
            </div>
            <button onclick="handleLogin()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-5 py-2 rounded-lg cursor-pointer transition-colors">
                Masuk
            </button>
        </div>

        <div id="login-status-block" class="hidden flex items-center justify-between text-sm">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-slate-600">Login sebagai: <strong id="user-display-name" class="text-slate-900"></strong></span>
            </div>
            <button onclick="handleLogout()" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 font-semibold px-3 py-1.5 rounded-lg transition-colors cursor-pointer">
                Keluar
            </button>
        </div>
    </div>

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-10 animate-fade-in">
        
        <div class="mb-6 flex flex-wrap gap-2 justify-between items-center">
            <a href="riwayat.html" class="inline-flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition-colors shadow-md cursor-pointer">
                🔍 Buka Lembar Riwayat Laporan →
            </a>
            
            <a href="absensi.html" class="inline-flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-sm font-semibold px-4 py-2.5 rounded-xl transition-colors border border-indigo-100 cursor-pointer">
                📊 Absensi →
            </a>
        </div>

        <div class="mb-8 text-center">
            <h1 class="text-2xl sm:text-3xl font-semibold text-slate-900 tracking-tight">Laporan Meditasi Harian</h1>
            <p id="role-indicator" class="mt-2 text-xs sm:text-sm text-emerald-600 font-medium">Mode: Pengguna Umum</p>
        </div>

        <form id="meditationForm" class="space-y-6">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="tanggal" class="block text-sm font-medium text-slate-700 mb-1.5">Tanggal</label>
                    <input type="date" id="tanggal" name="tanggal" required class="w-full rounded-lg border border-slate-200 px-3 py-2 text-slate-900 outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label for="nama" class="block text-sm font-medium text-slate-700 mb-1.5">Nama</label>
                    <input type="text" id="nama" name="nama" placeholder="Nama Anda" required class="w-full rounded-lg border border-slate-200 px-3 py-2 text-slate-900 outline-none focus:border-emerald-500">
                </div>
            </div>

            <hr class="border-slate-100">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Ikut sesi meditasi hari ini?</label>
                <div class="flex gap-6">
                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="ikut_sesi" value="Ya" required class="accent-emerald-600"> <span>Ya</span></label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="ikut_sesi" value="Tidak" class="accent-emerald-600"> <span>Tidak</span></label>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="durasi_jalan" class="block text-sm font-medium text-slate-700 mb-1">Durasi Meditasi Jalan</label>
                    <textarea id="durasi_jalan" name="durasi_jalan" rows="3" placeholder="Contoh: 10 menit" class="w-full rounded-lg border border-slate-200 px-4 py-2 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="durasi_duduk" class="block text-sm font-medium text-slate-700 mb-1">Durasi Meditasi Duduk</label>
                    <textarea id="durasi_duduk" name="durasi_duduk" rows="3" placeholder="Contoh: 30 menit" class="w-full rounded-lg border border-slate-200 px-4 py-2 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="frekuensi_wandering" class="block text-sm font-medium text-slate-700 mb-1">Frekuensi Wandering Mind</label>
                    <textarea id="frekuensi_wandering" name="frekuensi_wandering" rows="3" placeholder="Contoh: 1-5 kali" class="w-full rounded-lg border border-slate-200 px-4 py-4 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="kembali_cepat" class="block text-sm font-medium text-slate-700 mb-1">Saat menyadari pikiran mengembara, apakah dapat kembali konsentrasi ke napas dengan cepat?</label>
                    <textarea id="kembali_cepat" name="kembali_cepat" rows="3" placeholder="Contoh: Ya, mudah/sulit" class="w-full rounded-lg border border-slate-200 px-4 py-4 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="durasi_hold" class="block text-sm font-medium text-slate-700 mb-1">Durasi bisa fokus pegang nafas tanpa gangguan(terlama dan terpendek)</label>
                    <textarea id="durasi_hold" name="durasi_hold" rows="3" placeholder="Contoh: Terlama: 20 menit, terpendek: 10 menit" class="w-full rounded-lg border border-slate-200 px-4 py-4 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="durasi_halus" class="block text-sm font-medium text-slate-700 mb-1">Apakah ada nafas halus</label>
                    <textarea id="durasi_halus" name="durasi_halus" rows="3" placeholder="Contoh: Ya, sekitar 10 menit/ tidak ada" class="w-full rounded-lg border border-slate-200 px-4 py-2 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="muncul_cahaya" class="block text-sm font-medium text-slate-700 mb-1">Muncul Cahaya</label>
                    <textarea id="muncul_cahaya" name="muncul_cahaya" rows="3" placeholder="Contoh: Tidak ada/Ya, sedikit" class="w-full rounded-lg border border-slate-200 px-4 py-4 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="pengalaman" class="block text-sm font-medium text-slate-700 mb-1">Pengalaman / Pengamatan Kondisi Batin</label>
                    <textarea id="pengalaman" name="pengalaman" rows="3" placeholder="Apa yang Anda rasakan selama meditasi?" class="w-full rounded-lg border border-slate-200 px-4 py-3 text-sm outline-none focus:border-emerald-500"></textarea>
                </div>

                <div class="bg-indigo-50/40 border border-indigo-100 rounded-xl p-4">
                    <label for="review_sharing" class="block text-sm font-medium text-indigo-900 mb-1">Review dari Ci Suk Wan saat Sesi Sharing</label>
                    <textarea id="review_sharing" name="review_sharing" rows="2" placeholder="Tuliskan review/arahan dari Ci Suk Wan yang diberikan saat sesi sharing..." class="w-full rounded-lg border border-indigo-200 bg-white px-4 py-2 text-sm outline-none focus:border-indigo-500"></textarea>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" id="btn-submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm active:scale-[0.99] transition-all cursor-pointer">
                    Simpan Laporan Meditasi
                </button>
            </div>
        </form>

    </div>

    <div id="toast" class="hidden fixed bottom-5 right-5 left-5 sm:left-auto sm:w-96 bg-slate-900 text-white px-5 py-4 rounded-xl shadow-lg flex items-center gap-3 transition-all z-50">
        <div id="toast-text" class="text-sm font-medium">Aksi Berhasil!</div>
    </div>

<script>
        // Set default tanggal hari ini
        document.getElementById('input-tanggal').value = new Date().toISOString().split('T')[0];

        function checkLoginState() {
            const role = localStorage.getItem('currentUserRole') || 'User';
            const loginArea = document.getElementById('login-area');
            const logoutArea = document.getElementById('logout-area');
            const txtStatus = document.getElementById('admin-status-text');
            const boxReview = document.getElementById('box-review-sharing');

            if(role === 'User') {
                loginArea.classList.remove('hidden');
                logoutArea.classList.add('hidden');
                boxReview.classList.add('hidden');
            } else {
                loginArea.classList.add('hidden');
                logoutArea.classList.remove('hidden');
                boxReview.classList.remove('hidden');
                txtStatus.innerText = `Mode Admin: ${role === 'SukWan' ? 'Ci Suk Wan' : 'Ci Titin'}`;
            }
        }

        function prosesLogin() {
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-pass').value;

            if(email === 'sukwan@meditasi.com' && pass === 'sukwan123') {
                localStorage.setItem('currentUserRole', 'SukWan');
                alert("Selamat datang Ci Suk Wan! Mode Guru aktif.");
            } else if(email === 'titin@meditasi.com' && pass === 'titin123') {
                localStorage.setItem('currentUserRole', 'Titin');
                alert("Selamat datang Ci Titin! Mode Editor aktif.");
            } else {
                alert("Email atau password admin salah!");
                return;
            }
            document.getElementById('admin-email').value = '';
            document.getElementById('admin-pass').value = '';
            checkLoginState();
        }

        function prosesLogout() {
            localStorage.setItem('currentUserRole', 'User');
            alert("Keluar dari Mode Admin. Sekarang dalam Mode Pengguna Umum.");
            checkLoginState();
        }

        // ================================================================
        // PERBAIKAN UTAMA: CEK TARGET SECARA IGNORE CASE (HURUF BESAR / KECIL)
        // ================================================================
        function cekTargetOtomatis() {
            const namaInput = document.getElementById('input-nama').value.trim().toLowerCase(); // Jadikan huruf kecil semua
            const tglInput = document.getElementById('input-tanggal').value;
            const targetDb = JSON.parse(localStorage.getItem('target_db')) || [];
            
            const boxPR = document.getElementById('box-pr-otomatis');
            const teksPR = document.getElementById('teks-pr-otomatis');

            if(!namaInput || !tglInput) {
                boxPR.classList.add('hidden');
                return;
            }

            // Mencocokkan nama dengan mengubah pembandingnya ke .toLowerCase() juga
            const found = targetDb.find(t => t.nama.trim().toLowerCase() === namaInput && t.tanggal === tglInput);

            if(found && found.pr_individual || (found && found.pr_individu)) {
                teksPR.innerText = found.pr_individu || found.pr_individual;
                boxPR.classList.remove('hidden');
            } else {
                boxPR.classList.add('hidden');
            }
        }

        function dapatkanParameterUrl() {
            const params = new URLSearchParams(window.location.search);
            const editId = params.get('editId');
            if(editId) {
                siapkanModeEdit(parseInt(editId));
            }
        }

        function siapkanModeEdit(id) {
            const db = JSON.parse(localStorage.getItem('meditasi_db')) || [];
            const data = db.find(item => item.id === id);
            if(!data) return;

            document.getElementById('form-title').innerText = "📝 Mode Koreksi / Edit Jurnal Meditasi";
            document.getElementById('edit-id').value = data.id;
            document.getElementById('input-nama').value = data.nama || '';
            document.getElementById('input-tanggal').value = data.tanggal || '';
            
            const radios = document.getElementsByName('ikut_sesi');
            for(let r of radios) {
                if(r.value === data.ikut_sesi) r.checked = true;
            }

            document.getElementById('duduk').value = data.durasi_duduk || '';
            document.getElementById('jalan').value = data.durasi_jalan || '';
            document.getElementById('wandering').value = data.frekuensi_wandering || '';
            document.getElementById('kembali').value = data.kembali_cepat || '';
            document.getElementById('hold').value = data.durasi_hold || '';
            document.getElementById('halus').value = data.durasi_halus || '';
            document.getElementById('cahaya').value = data.muncul_cahaya || '';
            document.getElementById('pengalaman').value = data.pengalaman || '';
            document.getElementById('review-sharing').value = data.review_sharing || '';

            cekTargetOtomatis();
        }

        function simpanJurnal(e) {
            e.preventDefault();
            const db = JSON.parse(localStorage.getItem('meditasi_db')) || [];
            const editId = document.getElementById('edit-id').value;

            const nama = document.getElementById('input-nama').value.trim();
            const tanggal = document.getElementById('input-tanggal').value;
            const ikut_sesi = document.querySelector('input[name="ikut_sesi"]:checked').value;
            const durasi_duduk = document.getElementById('duduk').value;
            const durasi_jalan = document.getElementById('jalan').value;
            const frekuensi_wandering = document.getElementById('wandering').value;
            const kembali_cepat = document.getElementById('kembali').value;
            const durasi_hold = document.getElementById('hold').value;
            const durasi_halus = document.getElementById('halus').value;
            const muncul_cahaya = document.getElementById('cahaya').value;
            const pengalaman = document.getElementById('pengalaman').value;
            const review_sharing = document.getElementById('review-sharing').value;

            // Ambil text PR otomatis jika ada saat ini
            const targetDb = JSON.parse(localStorage.getItem('target_db')) || [];
            const foundTarget = targetDb.find(t => t.nama.toLowerCase() === nama.toLowerCase() && t.tanggal === tanggal);
            const pr_individu = foundTarget ? (foundTarget.pr_individu || foundTarget.pr_individual) : "";

            if(editId) {
                // UPDATE DATA LAMA
                const idx = db.findIndex(item => item.id === parseInt(editId));
                if(idx !== -1) {
                    db[idx] = { 
                        ...db[idx], nama, tanggal, ikut_sesi, durasi_duduk, durasi_jalan, 
                        frekuensi_wandering, kembali_cepat, durasi_hold, durasi_halus, 
                        muncul_cahaya, pengalaman, review_sharing,
                        pr_individu: pr_individu || db[idx].pr_individu || ""
                    };
                    alert("Jurnal Berhasil Diperbarui / Dikoreksi!");
                }
            } else {
                // BUAT DATA JURNAL BARU
                const jurnalBaru = {
                    id: Date.now(), nama, tanggal, ikut_sesi, durasi_duduk, durasi_jalan,
                    frekuensi_wandering, kembali_cepat, durasi_hold, durasi_halus,
                    muncul_cahaya, pengalaman, review_sharing, pr_individu
                };
                db.push(jurnalBaru);
                alert("Jurnal Sukses Terkirim & Tersimpan!");
            }

            localStorage.setItem('meditasi_db', JSON.stringify(db));
            
            // Redirect jika setelah edit, atau reset form jika entri baru
            if(editId) {
                window.location.href = "riwayat.html";
            } else {
                document.getElementById('jurnal-form').reset();
                document.getElementById('edit-id').value = "";
                document.getElementById('box-pr-otomatis').classList.add('hidden');
                document.getElementById('input-tanggal').value = new Date().toISOString().split('T')[0];
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkLoginState();
            dapatkanParameterUrl();
        });
    </script>
</body>
</html>
