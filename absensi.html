<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Absensi Matriks Meditasi (Juli - Agustus)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #f8fafc; }
        
        /* Pewarnaan Dropdown secara Dinamis */
        .select-yes {
            background-color: #06b6d4 !important; /* Cyan / Biru terang mirip contoh gambar */
            color: #ffffff !important;
            font-weight: bold;
        }
        .select-no {
            background-color: #f1f5f9 !important; /* Abu-abu netral */
            color: #475569 !important;
        }

        /* Pembeku Kolom Nama (Sticky) agar saat di-scroll ke samping namanya tetap terkunci */
        .sticky-col {
            position: sticky;
            left: 0;
            background-color: #f8fafc !important;
            border-right: 2px solid #cbd5e1 !important;
            z-index: 10;
        }

        /* Desain Scrollbar bawah tabel */
        .custom-scrollbar::-webkit-scrollbar {
            height: 10px;
            width: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 6px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen py-6 px-4 sm:py-8">

    <div class="max-w-full mx-auto bg-white rounded-2xl shadow-md border border-slate-100 p-4 sm:p-6">
        
        <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
            <a href="index.html" class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors">
                ← Kembali ke Halaman Utama
            </a>
            <button onclick="saveMatrixChanges()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-6 py-2.5 rounded-xl shadow-sm transition-all active:scale-95 cursor-pointer">
                💾 Simpan Semua Perubahan Absensi
            </button>
        </div>

        <div class="mb-6">
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">📋 Tabel Kontrol Absensi (1 Juli - 31 Agustus)</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">Geser tabel ke kanan untuk melihat tanggal berikutnya. Klik dropdown untuk mengubah status Yes/No (Warna Biru Otomatis pada opsi Yes).</p>
        </div>

        <div class="overflow-x-auto border border-slate-200 rounded-xl shadow-xs custom-scrollbar">
            <table class="w-full text-xs sm:text-sm text-left border-collapse">
                <thead class="bg-slate-50 text-slate-700 font-bold border-b border-slate-200 sticky top-0 z-20">
                    <tr id="table-headers">
                        </tr>
                </thead>
                <tbody id="table-matrix-rows" class="divide-y divide-slate-200 bg-white">
                    </tbody>
            </table>
        </div>

    </div>

    <div id="toast" class="hidden fixed bottom-5 right-5 bg-slate-950 text-white px-5 py-3.5 rounded-xl shadow-lg text-sm font-medium z-50 transition-all">
        ✅ Perubahan absensi berhasil disimpan ke sistem!
    </div>

    <script>
        // MASTER DAFTAR NAMA MURID (31 Nama Sesuai Permintaan)
        const masterMurid = [
            "Suk Wan", "Ahin", "Heri S", "gUyong", "Yuliana", "Leonardi", "Limey", 
            "Muliani", "Heri Susanto", "Titin", "Harvey", "Meini", "Rini", "Johan", 
            "Ani", "Santi", "Jessica", "Herliana", "Yu Ing", "Aji", "Nanda", "Henry", 
            "Yanti", "Ria", "Enje", "Diana", "Adi", "Neneng", "Suryani"
        ];
        
        // Daftarkan ke LocalStorage agar konsisten
        localStorage.setItem('murid_master', JSON.stringify(masterMurid));

        // GENERATE DAFTAR TANGGAL: 1 Juli s/d 31 Agustus 2026
        const tanggalList = [];
        
        // Juli (31 Hari)
        for (let i = 1; i <= 31; i++) {
            let day = i < 10 ? '0' + i : i;
            tanggalList.push(`2026-07-${day}`);
        }
        // Agustus (31 Hari)
        for (let i = 1; i <= 31; i++) {
            let day = i < 10 ? '0' + i : i;
            tanggalList.push(`2026-08-${day}`);
        }

        function renderMatrix() {
            const db = JSON.parse(localStorage.getItem('meditasi_db')) || [];
            const headerRow = document.getElementById('table-headers');
            const tbody = document.getElementById('table-matrix-rows');

            // 1. Render Header Nama & Tanggal (M/D/YYYY)
            let headerHTML = `<th class="px-4 py-3.5 bg-slate-100 text-slate-900 font-bold border-b-2 border-slate-300 sticky-col min-w-[160px]">Nama Murid</th>`;
            tanggalList.forEach(tgl => {
                const d = new Date(tgl);
                const displayDate = `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
                headerHTML += `<th class="px-3 py-3.5 text-center font-semibold border-r border-slate-200 min-w-[95px]">${displayDate}</th>`;
            });
            headerRow.innerHTML = headerHTML;

            // 2. Render Baris Setiap Murid
            tbody.innerHTML = '';
            masterMurid.forEach(nama => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/50 transition-colors";
                
                let rowHTML = `<td class="px-4 py-3 font-bold text-slate-900 sticky-col shadow-xs">${nama}</td>`;

                tanggalList.forEach(tgl => {
                    // Otomatisasi: Deteksi pengisian jurnal dari database
                    const sudahIsiJurnal = db.some(item => item.tanggal === tgl && item.nama.toLowerCase().trim() === nama.toLowerCase().trim());
                    
                    // Deteksi perubahan manual terdahulu
                    const manualSaves = JSON.parse(localStorage.getItem(`absensi_manual_${tgl}`)) || {};
                    
                    let status = sudahIsiJurnal ? "Yes" : "No";
                    if (manualSaves[nama]) {
                        status = manualSaves[nama];
                    }

                    const selectClass = status === "Yes" ? "select-yes" : "select-no";

                    rowHTML += `
                        <td class="px-1.5 py-1.5 text-center border-r border-slate-100">
                            <select data-nama="${nama}" data-tanggal="${tgl}" onchange="updateColors(this)"
                                class="w-full text-center rounded px-1 py-1 text-xs border border-slate-200 outline-none cursor-pointer font-semibold transition-all ${selectClass}">
                                <option value="Yes" ${status === 'Yes' ? 'selected' : ''}>Yes</option>
                                <option value="No" ${status === 'No' ? 'selected' : ''}>No</option>
                            </select>
                        </td>
                    `;
                });

                tr.innerHTML = rowHTML;
                tbody.appendChild(tr);
            });
        }

        // Mengubah warna dropdown secara langsung di layar saat dipilih tanpa delay
        function updateColors(element) {
            if (element.value === "Yes") {
                element.className = "w-full text-center rounded px-1 py-1 text-xs border border-transparent outline-none cursor-pointer font-semibold transition-all select-yes";
            } else {
                element.className = "w-full text-center rounded px-1 py-1 text-xs border border-slate-200 outline-none cursor-pointer font-semibold transition-all select-no";
            }
        }

        // Menyimpan status modifikasi manual massal ke LocalStorage
        function saveMatrixChanges() {
            const dropdowns = document.querySelectorAll('select[data-nama]');
            const dataPerTanggal = {};

            dropdowns.forEach(select => {
                const nama = select.getAttribute('data-nama');
                const tgl = select.getAttribute('data-tanggal');
                const nilai = select.value;

                if (!dataPerTanggal[tgl]) {
                    dataPerTanggal[tgl] = {};
                }
                dataPerTanggal[tgl][nama] = nilai;
            });

            for (const tgl in dataPerTanggal) {
                localStorage.setItem(`absensi_manual_${tgl}`, JSON.stringify(dataPerTanggal[tgl]));
            }

            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 3000);

            renderMatrix();
        }

        // Tampilkan matriks saat pertama kali dibuka
        renderMatrix();
    </script>
</body>
</html>
