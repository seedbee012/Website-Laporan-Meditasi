<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriks Absensi Bulanan Meditasi</title>
    <!-- Script Tailwind & html2pdf -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background-color: #f8fafc; }
        .table-container {
            max-height: 75vh;
            overflow: auto;
        }
        /* Mengunci kolom No dan Nama agar tidak bergeser saat scroll horizontal */
        .sticky-col-no {
            position: sticky;
            left: 0;
            background-color: #ffffff;
            z-index: 10;
        }
        .sticky-col-nama {
            position: sticky;
            left: 35px;
            background-color: #ffffff;
            z-index: 10;
            box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1);
        }
        .sticky-header-no {
            position: sticky;
            left: 0;
            top: 0;
            background-color: #0f172a;
            z-index: 20;
        }
        .sticky-header-nama {
            position: sticky;
            left: 35px;
            top: 0;
            background-color: #0f172a;
            z-index: 20;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen py-6 px-4">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-100 p-4 sm:p-6">
        
        <!-- NAVIGASI ATAS -->
        <div class="mb-6 flex flex-wrap gap-3 justify-between items-center border-b border-slate-100 pb-4 no-print">
            <a href="index.html" class="inline-flex items-center gap-2 text-slate-600 hover:text-slate-900 text-sm font-semibold transition-colors">
                ← Kembali ke Isi Jurnal
            </a>
            <button onclick="downloadMatriksPDF()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-sm px-4 py-2 rounded-xl transition-all shadow-xs flex items-center gap-2 cursor-pointer">
                Unduh PDF Matriks Bulanan 📄
            </button>
        </div>

        <!-- HEADER UTAMA -->
        <div class="mb-6 text-center">
            <h1 class="text-xl font-bold text-slate-900 uppercase tracking-tight">Matriks Rekap Absensi Bulanan</h1>
            <p class="text-xs text-slate-500 mt-1">Rekapitulasi status kehadiran murid per bulan periode Juli s/d Desember.</p>
        </div>

        <!-- AREA CETAK MATRIKS -->
        <div id="area-cetak-matriks" class="p-1">
            <div class="table-container border border-slate-200 rounded-xl">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-slate-900 text-white font-semibold text-center divide-x divide-slate-700">
                            <th class="p-3 text-left sticky-header-no min-w-[35px]">No</th>
                            <th class="p-3 text-left sticky-header-nama min-w-[150px]">Nama Murid</th>
                            <th class="p-3 text-center min-w-[90px]">Juli</th>
                            <th class="p-3 text-center min-w-[90px]">Agustus</th>
                            <th class="p-3 text-center min-w-[90px]">September</th>
                            <th class="p-3 text-center min-w-[90px]">Oktober</th>
                            <th class="p-3 text-center min-w-[90px]">November</th>
                            <th class="p-3 text-center min-w-[90px]">Desember</th>
                        </tr>
                    </thead>
                    <tbody id="matriks-bulanan-body" class="divide-y divide-slate-200 bg-white">
                        <!-- Data Baris Murid akan di-render otomatis lewat Javascript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Daftar nama murid tetap sesuai urutan gambar Anda
        const daftarMurid = [
            "Suk Wan", "Ahin", "Heri Sg", "Uyong", "Yuliana", "Leonardi", 
            "Limey", "Muliani", "Heri Susanto", "Titin", "Harvey", "Meini", 
            "Rini", "Johan", "Ani", "Santi", "Jessica", "Herliana", "Yu Ing", 
            "Aji", "Nanda", "Henry", "Yanti", "Ria", "Enje", "Diana", 
            "Adi", "Neneng", "Suryani"
        ];

        // Definisi urutan bulan target (Juli = indeks ke-6, Desember = indeks ke-11)
        const indeksBulan = [6, 7, 8, 9, 10, 11]; 

        function renderMatriksBulanan() {
            const db = JSON.parse(localStorage.getItem('meditasi_db')) || [];
            const tbody = document.getElementById('matriks-bulanan-body');
            tbody.innerHTML = '';

            daftarMurid.forEach((nama, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors divide-x divide-slate-200 text-center";

                // 1. Kolom Nomor Urut (Sticky)
                const tdNo = document.createElement('td');
                tdNo.className = "p-3 font-medium text-slate-400 bg-white text-left sticky-col-no min-w-[35px]";
                tdNo.innerText = index + 1;
                tr.appendChild(tdNo);

                // 2. Kolom Nama Murid (Sticky)
                const tdNama = document.createElement('td');
                tdNama.className = "p-3 font-semibold text-slate-900 bg-white text-left sticky-col-nama min-w-[150px]";
                tdNama.innerText = nama;
                tr.appendChild(tdNama);

                // 3. Looping Pengecekan per baris bulan (Juli sampai Desember)
                indeksBulan.forEach(bulan => {
                    const tdStatus = document.createElement('td');
                    tdStatus.className = "p-3 text-center font-bold text-[11px]";

                    // Cari apakah murid ini punya riwayat HADIR ("Ya"/"Yes") di bulan berjalan
                    const adakahKehadiranDiBulanIni = db.some(item => {
                        const itemNama = (item.nama || '').toLowerCase().trim();
                        const targetNama = nama.toLowerCase().trim();
                        
                        if (item.tanggal) {
                            const d = new Date(item.tanggal);
                            const matchBulan = d.getMonth() === bulan;
                            const statusMentah = (item.ikut_sesi || '').toLowerCase().trim();
                            const isHadir = statusMentah === 'ya' || statusMentah === 'yes';
                            
                            return itemNama.includes(targetNama) && matchBulan && isHadir;
                        }
                        return false;
                    });

                    // Atur warna dan teks penanda box persis gaya excel Anda
                    if (adakahKehadiranDiBulanIni) {
                        tdStatus.innerText = "Yes";
                        tdStatus.className += " bg-cyan-100 text-cyan-900"; // Cyan terang pas sesuai mockup
                    } else {
                        tdStatus.innerText = "No";
                        tdStatus.className += " bg-slate-50 text-slate-400 font-normal";
                    }

                    tr.appendChild(tdStatus);
                });

                tbody.appendChild(tr);
            });
        }

        // Fungsi download PDF layout Landscape rapi
        function downloadMatriksPDF() {
            const element = document.getElementById('area-cetak-matriks');
            const opsi = {
                margin:       [0.4, 0.4, 0.4, 0.4],
                filename:     `Rekap_Matriks_Bulanan_Meditasi.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
            };
            html2pdf().set(opsi).from(element).save();
        }

        // Inisialisasi render saat halaman dibuka
        window.addEventListener('DOMContentLoaded', renderMatriksBulanan);
    </script>
</body>
</html>
