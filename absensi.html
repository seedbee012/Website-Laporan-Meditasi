<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriks Absensi Juli 2026</title>
    <!-- Script Tailwind & html2pdf -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background-color: #f8fafc; }
        .table-container {
            max-height: 75vh;
            overflow-x: auto;
            overflow-y: auto;
        }
        /* Mengunci kolom nomor dan nama di sebelah kiri agar tidak ikut tergeser saat scroll kanan */
        .sticky-col-no {
            position: sticky;
            left: 0;
            background-color: #ffffff;
            z-index: 10;
        }
        .sticky-col-nama {
            position: sticky;
            left: 35px;
            background-color: #ffffff;
            z-index: 10;
            box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1);
        }
        .sticky-header-no {
            position: sticky;
            left: 0;
            top: 0;
            background-color: #0f172a;
            z-index: 20;
        }
        .sticky-header-nama {
            position: sticky;
            left: 35px;
            top: 0;
            background-color: #0f172a;
            z-index: 20;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen py-6 px-4">

    <div class="max-w-[99%] mx-auto bg-white rounded-2xl shadow-sm border border-slate-100 p-4 sm:p-6">
        
        <!-- NAVIGASI ATAS -->
        <div class="mb-6 flex flex-wrap gap-3 justify-between items-center border-b border-slate-100 pb-4 no-print">
            <a href="index.html" class="inline-flex items-center gap-2 text-slate-600 hover:text-slate-900 text-sm font-semibold transition-colors">
                ← Kembali ke Isi Jurnal
            </a>
            <a href="riwayat.html" class="inline-flex items-center gap-2 text-indigo-600 hover:text-indigo-900 text-sm font-semibold transition-colors">
                🔄 Gabungkan Data WA / Lihat Riwayat →
            </a>
            <button onclick="downloadMatriksPDF()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-sm px-4 py-2 rounded-xl transition-all shadow-xs flex items-center gap-2 cursor-pointer">
                Unduh PDF Absensi Juli 📄
            </button>
        </div>

        <!-- HEADER MATRIKS -->
        <div class="mb-4 text-center">
            <h1 class="text-xl font-bold text-slate-900 uppercase tracking-tight">Matriks Absensi Jurnal (1 Juli - 31 Juli 2026)</h1>
            <p class="text-xs text-slate-500 mt-1">Geser tabel ke kanan untuk melihat deretan tanggal dari 1/7/2026 sampai 31/7/2026.</p>
        </div>

        <!-- AREA CETAK MATRIKS -->
        <div id="area-cetak-matriks" class="p-1">
            <div class="table-container border border-slate-200 rounded-xl">
                <table class="w-full text-left border-collapse text-[10px]">
                    <thead>
                        <tr id="header-row-matriks" class="bg-slate-900 text-white font-semibold text-center divide-x divide-slate-700">
                            <th class="p-2 text-left sticky-header-no min-w-[35px]">No</th>
                            <th class="p-2 text-left sticky-header-nama min-w-[140px]">Nama Murid</th>
                            <!-- Kolom tanggal 1/7/2026 s/d 31/7/2026 otomatis di-generate ke kanan oleh script -->
                        </tr>
                    </thead>
                    <tbody id="matriks-harian-body" class="divide-y divide-slate-200 bg-white">
                        <!-- Baris nama murid otomatis muncul di sini -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Daftar nama sesuai data absensi kelas Anda
        const daftarMurid = [
            "Suk Wan", "Ahin", "Heri Sg", "Uyong", "Yuliana", "Leonardi", 
            "Limey", "Muliani", "Heri Susanto", "Titin", "Harvey", "Meini", 
            "Rini", "Johan", "Ani", "Santi", "Jessica", "Herliana", "Yu Ing", 
            "Aji", "Nanda", "Henry", "Yanti", "Ria", "Enje", "Diana", 
            "Adi", "Neneng", "Suryani"
        ];

        function renderMatriksJuli() {
            const db = JSON.parse(localStorage.getItem('meditasi_db')) || [];
            const tahunTarget = 2026;
            const jumlahHariJuli = 31; // Dikunci 31 hari untuk Juli

            // 1. GENERATE HEADER TANGGAL KANAN (1/7/2026 sampai 31/7/2026)
            const headerRow = document.getElementById('header-row-matriks');
            for (let hari = 1; hari <= jumlahHariJuli; hari++) {
                const th = document.createElement('th');
                th.className = "p-1.5 text-center min-w-[65px] bg-slate-900 text-white border-l border-slate-700 font-mono font-medium";
                th.innerText = `${hari}/7/${tahunTarget}`; // Tampilan tanggal yang Anda minta
                headerRow.appendChild(th);
            }

            // 2. GENERATE BARIS MURID KE BAWAH
            const tbody = document.getElementById('matriks-harian-body');
            tbody.innerHTML = '';

            daftarMurid.forEach((nama, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors divide-x divide-slate-200 text-center";

                // Kolom No (Sticky Kiri)
                const tdNo = document.createElement('td');
                tdNo.className = "p-2 font-medium text-slate-400 bg-white text-left sticky-col-no min-w-[35px]";
                tdNo.innerText = index + 1;
                tr.appendChild(tdNo);

                // Kolom Nama Murid (Sticky Kiri)
                const tdNama = document.createElement('td');
                tdNama.className = "p-2 font-bold text-slate-900 bg-white text-left sticky-col-nama min-w-[140px] whitespace-nowrap";
                tdNama.innerText = nama;
                tr.appendChild(tdNama);

                // Isi status Yes/No untuk masing-masing tanggal ke samping
                for (let hari = 1; hari <= jumlahHariJuli; hari++) {
                    const tdStatus = document.createElement('td');
                    tdStatus.className = "p-2 text-center font-bold text-[10px]";

                    // Format string tanggal database: YYYY-MM-DD (2026-07-01)
                    const formatHariStr = String(hari).padStart(2, '0');
                    const stringTanggalTarget = `${tahunTarget}-07-${formatHariStr}`;

                    // Pencocokan data nama dan tanggal di localStorage laptop
                    const matchData = db.find(item => {
                        const dbNama = (item.nama || '').toLowerCase().trim();
                        const targetNama = nama.toLowerCase().trim();
                        return dbNama.includes(targetNama) && item.tanggal === stringTanggalTarget;
                    });

                    if (matchData) {
                        const statusMentah = (matchData.ikut_sesi || '').toLowerCase().trim();
                        if (statusMentah === 'ya' || statusMentah === 'yes') {
                            tdStatus.innerText = "Yes";
                            tdStatus.className += " bg-cyan-100 text-cyan-900"; // Background Cyan terang
                        } else {
                            tdStatus.innerText = "No";
                            tdStatus.className += " bg-slate-50 text-slate-400 font-normal";
                        }
                    } else {
                        // Jika belum ada data masuk harian, default "No"
                        tdStatus.innerText = "No";
                        tdStatus.className += " bg-slate-50 text-slate-400 font-normal";
                    }

                    tr.appendChild(tdStatus);
                }

                tbody.appendChild(tr);
            });
        }

        // Cetak format Landscape Legal panjang biar muat semua tanggal
        function downloadMatriksPDF() {
            const element = document.getElementById('area-cetak-matriks');
            const opsi = {
                margin:       [0.3, 0.3, 0.3, 0.3],
                filename:     `Matriks_Absensi_Juli_2026.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'in', format: 'legal', orientation: 'landscape' }
            };
            html2pdf().set(opsi).from(element).save();
        }

        window.addEventListener('DOMContentLoaded', renderMatriksJuli);
    </script>
</body>
</html>
